
name: Build WPAudio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WPAudio.zip'
      - 'WPAudio_project_siap_build.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          set -e
          mkdir project
          if [ -f WPAudio.zip ]; then
            unzip -o WPAudio.zip -d project
          else
            unzip -o WPAudio_project_siap_build.zip -d project
          fi
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build debug APK
        run: |
          set -e
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan"
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          cd "$ROOT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WPAudio-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
