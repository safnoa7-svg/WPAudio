
name: Build WPAudio APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WPAudio.zip'
      - 'WPAudio_project_siap_build.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          set -e
          mkdir project
          if [ -f WPAudio.zip ]; then
            unzip -o WPAudio.zip -d project
          elif [ -f WPAudio_project_siap_build.zip ]; then
            unzip -o WPAudio_project_siap_build.zip -d project
          else
            echo "File ZIP proyek tidak ditemukan"
            exit 1
          fi

      - name: Locate Android project
        id: locate
        run: |
          set -e
          SETTINGS=$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle tidak ditemukan"
            find project -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          echo "root=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.root }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: WPAudio-debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
